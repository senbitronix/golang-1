services:
  todo-app-postgres:
    image: postgres:18.3-bookworm
    container_name: todo-app-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgData:/var/lib/postgresql
    restart: always